spring.application.name=jobfit
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/jobfit}
spring.datasource.username=${DB_USERNAME:jobfit}
spring.datasource.password=${DB_PASSWORD}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 프로필 생성·수정·삭제 허용 여부. env 누락 시 열리지 않도록 기본값은 차단(false)이며, 로컬 .env에서 true로 연다.
jobfit.profile.edit-enabled=${PROFILE_EDIT_ENABLED:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jobfit.clock.fixed-instant=